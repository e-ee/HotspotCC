name: Build HotspotCC with Theos
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos and patched iOS SDKs
        uses: Randomblock1/theos-action@v1
      - name: Compile, inspect linkage, and package
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1
          BINARY="$(find .theos/obj -type f -name HotspotCCProvider | head -1)"
          test -n "$BINARY"
          lipo -info "$BINARY"
          lipo -archs "$BINARY" | grep -qw arm64e
          otool -L "$BINARY" | tee /tmp/hotspotcc-links.txt
          grep -Fq '/System/Library/PrivateFrameworks/ControlCenterUIKit.framework/ControlCenterUIKit' /tmp/hotspotcc-links.txt
          DEB="$(find packages -name '*.deb' | head -1)"
          test -n "$DEB"
          python3 scripts/check_deb.py "$DEB"
      - uses: actions/upload-artifact@v4
        with:
          name: HotspotCC-Dopamine-Theos-arm64e
          path: packages/*.deb
          if-no-files-found: error
