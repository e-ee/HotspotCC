name: SmartHome Visualizer
on:
  push:
    branches: [smarthome-visualizer]
    paths: ['smarthome/*.m', 'smarthome/*.c', 'smarthome/*.h', '.github/workflows/smarthome.yml']
  workflow_dispatch:
concurrency:
  group: smarthome-visualizer
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Cancel obsolete branch builds
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner: context.repo.owner, repo: context.repo.repo, branch: 'smarthome-visualizer', per_page: 100});
            for (const r of runs) {
              if (r.id !== context.runId && ['queued', 'in_progress', 'waiting'].includes(r.status)) {
                try { await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: r.id}); } catch(e) { core.info(String(e.status)); }
              }
            }
      - uses: actions/checkout@v4
      - name: Compile ARM64 visualizer
        run: |
          mkdir -p build
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0 -fobjc-arc -fblocks -dynamiclib smarthome/LightShow.m smarthome/fishhook.c -o build/LightShow.dylib -install_name '@executable_path/Frameworks/LightShow.dylib' -framework UIKit -framework AVFoundation -framework Accelerate -framework Foundation -framework CoreGraphics -framework QuartzCore -Wno-deprecated-declarations
          codesign --force --sign - build/LightShow.dylib
          file build/LightShow.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: LightShow-arm64
          path: build/LightShow.dylib
